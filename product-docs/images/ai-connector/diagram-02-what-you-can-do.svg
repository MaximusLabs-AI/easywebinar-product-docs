<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1002" viewBox="0 0 1440 1002" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif"><title>What you can do with EasyWebinar's AI connector</title><desc>Webinars: list, create and schedule webinars and show registration links. Pages and emails: write and publish pages, write reminders and follow-ups. Engagement: add polls and offers, teach the AI Moderator your FAQs. Analytics: registrations, attendance, attendance rate and comparisons.</desc><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2559" flood-opacity="0.08"/></filter><linearGradient id="spk" x1="172.346" y1="100.765" x2="251.519" y2="9.1968" gradientUnits="userSpaceOnUse"><stop stop-color="#4058FB"/><stop offset="1" stop-color="#F29BB0"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f5ff"/><stop offset="1" stop-color="#fdf3f6"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8FF9"/></marker></defs><rect width="1440" height="1002" rx="28" fill="url(#hero)"/><text x="72" y="78" font-size="34" fill="#131927" font-weight="700" text-anchor="start">What you can do from the chat</text><text x="72" y="118" font-size="21" fill="#6b7185" font-weight="400" text-anchor="start">Four areas of your EasyWebinar account, each with a prompt to try.</text><rect x="72" y="170" width="636" height="372" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="100" y="198" width="56" height="56" rx="16" fill="#eef0ff"/><g transform="translate(114 212) scale(1.1667)" fill="none" stroke="#4058FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#4058FB"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></g><text x="176" y="236" font-size="26" fill="#131927" font-weight="700" text-anchor="start">Webinars</text><g transform="translate(102 271) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="136" y="290.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">List webinars and upcoming sessions</text><g transform="translate(102 312.0) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="136" y="331.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">Create and schedule live, simulive and evergreen</text><text x="136" y="358.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">webinars</text><g transform="translate(102 380.0) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="136" y="399.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">Show registration links and details</text><rect x="100" y="438" width="580" height="80" rx="16" fill="#f6f7fb" stroke="#e3e6ef"/><g transform="translate(118 454) scale(0.9167)" fill="none" stroke="#6b7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#6b7185"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g><text x="154" y="471.0" font-size="18" fill="#131927" font-weight="500" text-anchor="start">Create a live webinar called ‘Spring Launch’ next</text><text x="154" y="495.3" font-size="18" fill="#131927" font-weight="500" text-anchor="start">Thursday at 6 PM.</text><rect x="732" y="170" width="636" height="372" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="760" y="198" width="56" height="56" rx="16" fill="#eef0ff"/><g transform="translate(774 212) scale(1.1667)" fill="none" stroke="#4058FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#4058FB"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></g><text x="836" y="236" font-size="26" fill="#131927" font-weight="700" text-anchor="start">Pages and emails</text><g transform="translate(762 271) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="796" y="290.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">Write and publish registration, thank-you and</text><text x="796" y="317.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">waiting-room pages</text><g transform="translate(762 339.0) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="796" y="358.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">Write reminder and follow-up emails</text><rect x="760" y="438" width="580" height="80" rx="16" fill="#f6f7fb" stroke="#e3e6ef"/><g transform="translate(778 454) scale(0.9167)" fill="none" stroke="#6b7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#6b7185"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g><text x="814" y="471.0" font-size="18" fill="#131927" font-weight="500" text-anchor="start">Write the welcome email, three reminders and two</text><text x="814" y="495.3" font-size="18" fill="#131927" font-weight="500" text-anchor="start">follow-ups for my next webinar.</text><rect x="72" y="566" width="636" height="372" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="100" y="594" width="56" height="56" rx="16" fill="#eef0ff"/><g transform="translate(114 608) scale(1.1667)" fill="none" stroke="#4058FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#4058FB"><path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/></g><text x="176" y="632" font-size="26" fill="#131927" font-weight="700" text-anchor="start">Engagement</text><g transform="translate(102 667) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="136" y="686.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">Add polls and offers to a webinar</text><g transform="translate(102 708.0) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><g transform="translate(493.5 703.0) scale(0.0703)"><path d="M95.9666 52.7773C100.765 101.56 127.956 133.549 191.933 143.946C130.355 153.542 107.163 178.334 95.9666 238.313C85.5703 178.334 61.1787 155.142 0 150.343C60.7789 139.947 85.5703 111.957 95.9666 52.7773Z" fill="#7D8FF9"/><path d="M204.335 0C207.934 27.9903 223.928 42.7851 255.917 47.9833C224.728 53.5814 209.533 67.1766 203.935 97.5661C198.337 67.9764 183.142 53.5814 151.953 48.3832C183.142 42.7851 198.337 27.9903 204.335 0Z" fill="url(#spk)"/></g><text x="136" y="727.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">Teach your FAQs to the AI Moderator</text><rect x="100" y="834" width="580" height="80" rx="16" fill="#f6f7fb" stroke="#e3e6ef"/><g transform="translate(118 850) scale(0.9167)" fill="none" stroke="#6b7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#6b7185"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g><text x="154" y="867.0" font-size="18" fill="#131927" font-weight="500" text-anchor="start">Add a poll to my next webinar asking which topic</text><text x="154" y="891.3" font-size="18" fill="#131927" font-weight="500" text-anchor="start">attendees want covered first.</text><rect x="732" y="566" width="636" height="372" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="760" y="594" width="56" height="56" rx="16" fill="#eef0ff"/><g transform="translate(774 608) scale(1.1667)" fill="none" stroke="#4058FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#4058FB"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></g><text x="836" y="632" font-size="26" fill="#131927" font-weight="700" text-anchor="start">Analytics</text><g transform="translate(762 667) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="796" y="686.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">See registrations, attendance and attendance rate</text><g transform="translate(762 708.0) scale(0.9167)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="796" y="727.0" font-size="20" fill="#3b4256" font-weight="400" text-anchor="start">Compare how your webinars performed</text><rect x="760" y="834" width="580" height="80" rx="16" fill="#f6f7fb" stroke="#e3e6ef"/><g transform="translate(778 850) scale(0.9167)" fill="none" stroke="#6b7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#6b7185"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g><text x="814" y="867.0" font-size="18" fill="#131927" font-weight="500" text-anchor="start">How many people registered for my last webinar, and</text><text x="814" y="891.3" font-size="18" fill="#131927" font-weight="500" text-anchor="start">how many attended?</text><text x="72" y="974" font-size="18" fill="#6b7185" font-weight="400" text-anchor="start">AI Moderator is part of EasyWebinar AI</text><g transform="translate(402.952 956) scale(0.0625)"><path d="M95.9666 52.7773C100.765 101.56 127.956 133.549 191.933 143.946C130.355 153.542 107.163 178.334 95.9666 238.313C85.5703 178.334 61.1787 155.142 0 150.343C60.7789 139.947 85.5703 111.957 95.9666 52.7773Z" fill="#7D8FF9"/><path d="M204.335 0C207.934 27.9903 223.928 42.7851 255.917 47.9833C224.728 53.5814 209.533 67.1766 203.935 97.5661C198.337 67.9764 183.142 53.5814 151.953 48.3832C183.142 42.7851 198.337 27.9903 204.335 0Z" fill="url(#spk)"/></g></svg>