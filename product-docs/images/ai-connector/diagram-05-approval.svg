<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif"><title>Changes wait for your approval</title><desc>Example: asked to create a live webinar, the assistant shows what it will create, and nothing happens until you approve. Reading runs at once; creating, publishing, changing or deleting asks you first.</desc><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2559" flood-opacity="0.08"/></filter><linearGradient id="spk" x1="172.346" y1="100.765" x2="251.519" y2="9.1968" gradientUnits="userSpaceOnUse"><stop stop-color="#4058FB"/><stop offset="1" stop-color="#F29BB0"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f5ff"/><stop offset="1" stop-color="#fdf3f6"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8FF9"/></marker></defs><rect width="1440" height="870" rx="28" fill="url(#hero)"/><text x="72" y="78" font-size="34" fill="#131927" font-weight="700" text-anchor="start">Reads run at once. Changes wait for you.</text><text x="72" y="118" font-size="21" fill="#6b7185" font-weight="400" text-anchor="start">What a change looks like in the chat, step by step.</text><rect x="72" y="170" width="820" height="640" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="332" y="202" width="532" height="84" rx="20" fill="#4058FB"/><text x="356" y="236.0" font-size="20" fill="#fff" font-weight="600" text-anchor="start">Create a live webinar called ‘Spring Launch’</text><text x="356" y="263.0" font-size="20" fill="#fff" font-weight="600" text-anchor="start">next Thursday at 6 PM.</text><text x="104" y="332" font-size="20" fill="#131927" font-weight="500" text-anchor="start">Here’s what I’ll create in EasyWebinar:</text><rect x="104" y="352" width="756" height="176" rx="16" fill="#f6f7fb" stroke="#e3e6ef"/><text x="128" y="392" font-size="18" fill="#6b7185" font-weight="600" text-anchor="start">Title</text><text x="292" y="392" font-size="18" fill="#131927" font-weight="600" text-anchor="start">Spring Launch</text><text x="128" y="428" font-size="18" fill="#6b7185" font-weight="600" text-anchor="start">Type</text><text x="292" y="428" font-size="18" fill="#131927" font-weight="600" text-anchor="start">Live webinar</text><text x="128" y="464" font-size="18" fill="#6b7185" font-weight="600" text-anchor="start">When</text><text x="292" y="464" font-size="18" fill="#131927" font-weight="600" text-anchor="start">Next Thursday, 6:00 PM</text><text x="128" y="500" font-size="18" fill="#6b7185" font-weight="600" text-anchor="start">Time zone</text><text x="292" y="500" font-size="18" fill="#131927" font-weight="600" text-anchor="start">Your webinar time zone</text><rect x="104" y="554" width="756" height="214" rx="16" fill="#fff" stroke="#a15c00" stroke-width="2"/><circle cx="144" cy="598" r="22" fill="#fff4e0"/><g transform="translate(132 586) scale(1.0000)" fill="none" stroke="#a15c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#a15c00"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></g><text x="180" y="594" font-size="20" fill="#131927" font-weight="700" text-anchor="start">This action creates something in your account</text><text x="180" y="620" font-size="17" fill="#6b7185" font-weight="500" text-anchor="start">EasyWebinar · create webinar</text><text x="128" y="666.0" font-size="17" fill="#3b4256" font-weight="400" text-anchor="start">Nothing happens until you approve. Pages and emails you approve go live and</text><text x="128" y="689.8" font-size="17" fill="#3b4256" font-weight="400" text-anchor="start">reach your registrants.</text><rect x="706" y="704" width="130" height="44" rx="10" fill="#4058FB" stroke="#4058FB" stroke-width="1.5"/><text x="771.0" y="732.48" font-size="18" fill="#fff" font-weight="600" text-anchor="middle">Approve</text><rect x="580" y="704" width="110" height="44" rx="10" fill="#fff" stroke="#e3e6ef" stroke-width="1.5"/><text x="635.0" y="732.48" font-size="18" fill="#131927" font-weight="600" text-anchor="middle">Deny</text><rect x="932" y="170" width="436" height="216" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="956" y="194" width="48" height="48" rx="14" fill="#e7f6ef"/><g transform="translate(968 206) scale(1.0000)" fill="none" stroke="#12805c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g><text x="1020" y="226" font-size="24" fill="#12805c" font-weight="700" text-anchor="start">Runs at once</text><g transform="translate(962 270) scale(0.7500)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="992" y="286" font-size="19" fill="#3b4256" font-weight="400" text-anchor="start">List webinars and sessions</text><g transform="translate(962 310) scale(0.7500)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="992" y="326" font-size="19" fill="#3b4256" font-weight="400" text-anchor="start">Show registration links</text><g transform="translate(962 350) scale(0.7500)" fill="none" stroke="#12805c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#12805c"><path d="M20 6 9 17l-5-5"/></g><text x="992" y="366" font-size="19" fill="#3b4256" font-weight="400" text-anchor="start">Report registrations and attendance</text><rect x="932" y="410" width="436" height="256" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="956" y="434" width="48" height="48" rx="14" fill="#fff4e0"/><g transform="translate(968 446) scale(1.0000)" fill="none" stroke="#a15c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#a15c00"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></g><text x="1020" y="466" font-size="24" fill="#a15c00" font-weight="700" text-anchor="start">Asks you first</text><g transform="translate(962 510) scale(0.7500)" fill="none" stroke="#a15c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#a15c00"><path d="M20 6 9 17l-5-5"/></g><text x="992" y="526" font-size="19" fill="#3b4256" font-weight="400" text-anchor="start">Create or schedule a webinar</text><g transform="translate(962 550) scale(0.7500)" fill="none" stroke="#a15c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#a15c00"><path d="M20 6 9 17l-5-5"/></g><text x="992" y="566" font-size="19" fill="#3b4256" font-weight="400" text-anchor="start">Publish a page, save an email</text><g transform="translate(962 590) scale(0.7500)" fill="none" stroke="#a15c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#a15c00"><path d="M20 6 9 17l-5-5"/></g><text x="992" y="606" font-size="19" fill="#3b4256" font-weight="400" text-anchor="start">Add a poll or offer</text><g transform="translate(962 630) scale(0.7500)" fill="none" stroke="#a15c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:#a15c00"><path d="M20 6 9 17l-5-5"/></g><text x="992" y="646" font-size="19" fill="#3b4256" font-weight="400" text-anchor="start">Delete anything</text></svg>