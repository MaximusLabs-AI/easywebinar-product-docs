<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif"><title>Example answers from the AI connector</title><desc>Illustrative example: asked for upcoming sessions, the assistant lists each webinar with its type, time and registrations; asked about the last webinar, it reports registered, attended and attendance rate.</desc><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2559" flood-opacity="0.08"/></filter><linearGradient id="spk" x1="172.346" y1="100.765" x2="251.519" y2="9.1968" gradientUnits="userSpaceOnUse"><stop stop-color="#4058FB"/><stop offset="1" stop-color="#F29BB0"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f5ff"/><stop offset="1" stop-color="#fdf3f6"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8FF9"/></marker></defs><rect width="1440" height="750" rx="28" fill="url(#hero)"/><text x="72" y="78" font-size="34" fill="#131927" font-weight="700" text-anchor="start">Ask a question, get your own numbers</text><text x="72" y="118" font-size="21" fill="#6b7185" font-weight="400" text-anchor="start">Illustrative answers. The assistant shows your own webinars and figures.</text><rect x="72" y="170" width="636" height="540" rx="20" fill="#ffffff" stroke="#e3e6ef" stroke-width="1.5" filter="url(#sh)"/><rect x="268" y="198" width="412" height="58" rx="18" fill="#4058FB"/><text x="292" y="234" font-size="19" fill="#fff" font-weight="600" text-anchor="start">Show my upcoming webinar sessions.</text><text x="100" y="300" font-size="20" fill="#131927" font-weight="500" text-anchor="start">You have 3 upcoming sessions:</text><rect x="100" y="326"