<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 714" width="1440" height="714" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, &quot;Noto Sans&quot;, Arial, sans-serif" role="img" aria-labelledby="d1-title d1-desc">
<title id="d1-title">Dashboard language and Webinar Language</title>
<desc id="d1-desc">Dashboard language: set with the flag button in the top bar, or Settings, My Profile, General Settings, Language; set by you while signed in to the dashboard; changes the dashboard interface; applies to the EasyWebinar dashboard; your own content, brand and integration names stay the same. Webinar Language: set on the webinar's Settings tab, General, Webinar Language; set by the host; sets the default language attendees get when they join; applies to live webinars; your own titles and text stay the same. Both: the same 11 languages.</desc>
<rect x="0" y="0" width="1440" height="714" fill="#ffffff"/>
<rect x="41" y="41" width="658" height="548" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
<text x="72" y="98" font-size="34" font-weight="600" fill="#131927">Dashboard language</text>
<text x="72" y="150" font-size="22" font-weight="600" fill="#5c5c5c">Where you set it</text>
<text x="72" y="182" font-size="24" fill="#131927"><tspan font-weight="600">Flag button</tspan><tspan font-weight="400"> in the top bar, or</tspan><tspan font-weight="600"> Settings → My</tspan></text>
<text x="72" y="214" font-size="24" fill="#131927"><tspan font-weight="600">Profile → General Settings → Language</tspan></text>
<text x="72" y="260" font-size="22" font-weight="600" fill="#5c5c5c">Who sets it</text>
<text x="72" y="292" font-size="24" fill="#131927"><tspan font-weight="400">You, while signed in to the dashboard</tspan></text>
<text x="72" y="338" font-size="22" font-weight="600" fill="#5c5c5c">What it changes</text>
<text x="72" y="370" font-size="24" fill="#131927"><tspan font-weight="400">The dashboard interface</tspan></text>
<text x="72" y="448" font-size="22" font-weight="600" fill="#5c5c5c">Applies to</text>
<text x="72" y="480" font-size="24" fill="#131927"><tspan font-weight="400">The EasyWebinar dashboard</tspan></text>
<text x="72" y="526" font-size="22" font-weight="600" fill="#5c5c5c">What stays the same</text>
<text x="72" y="558" font-size="24" fill="#131927"><tspan font-weight="400">Your own content, brand and integration names</tspan></text>
<rect x="741" y="41" width="658" height="548" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
<text x="772" y="98" font-size="34" font-weight="600" fill="#131927">Webinar Language</text>
<text x="772" y="150" font-size="22" font-weight="600" fill="#5c5c5c">Where you set it</text>
<text x="772" y="182" font-size="24" fill="#131927"><tspan font-weight="400">The webinar's</tspan><tspan font-weight="600"> Settings</tspan><tspan font-weight="400"> tab →</tspan><tspan font-weight="600"> General</tspan><tspan font-weight="400"> →</tspan></text>
<text x="772" y="214" font-size="24" fill="#131927"><tspan font-weight="600">Webinar Language</tspan></text>
<text x="772" y="260" font-size="22" font-weight="600" fill="#5c5c5c">Who sets it</text>
<text x="772" y="292" font-size="24" fill="#131927"><tspan font-weight="400">The host</tspan></text>
<text x="772" y="338" font-size="22" font-weight="600" fill="#5c5c5c">What it changes</text>
<text x="772" y="370" font-size="24" fill="#131927"><tspan font-weight="400">The default language attendees get when they</tspan></text>
<text x="772" y="402" font-size="24" fill="#131927"><tspan font-weight="400">join</tspan></text>
<text x="772" y="448" font-size="22" font-weight="600" fill="#5c5c5c">Applies to</text>
<text x="772" y="480" font-size="24" fill="#131927"><tspan font-weight="400">Live webinars</tspan></text>
<text x="772" y="526" font-size="22" font-weight="600" fill="#5c5c5c">What stays the same</text>
<text x="772" y="558" font-size="24" fill="#131927"><tspan font-weight="400">Your own titles and text</tspan></text>
<rect x="40" y="610" width="1360" height="72" rx="12" fill="#f5f5f5"/>
<text x="720" y="656" font-size="28" font-weight="600" fill="#131927" text-anchor="middle">Both: the same 11 languages</text>
</svg>
